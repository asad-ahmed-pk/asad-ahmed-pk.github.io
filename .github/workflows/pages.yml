# Publish site/ to GitHub Pages on every push to main.
# Repo setting needed once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# site/assets/css/site.css is committed (built locally by tool/build.sh), so CI runs no build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, like GitHub's own Pages templates: deploying in the same job right
  # after the upload raced the artifact listing ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check site (links, assets, a11y basics)
        run: SKIP_CSS=1 python3 tool/check.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
